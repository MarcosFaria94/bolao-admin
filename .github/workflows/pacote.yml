name: Pacote temporario

on:
  push:
    branches: [temp-pacote]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Classpath
        run: ./gradlew --no-daemon --stacktrace :app:copiarClasspath
      - name: Pacote
        run: |
          tar -czf pacote.tgz -C app/build/pacote libs
          ls -la pacote.tgz
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pacote-temp --yes --cleanup-tag || true
          gh release create pacote-temp pacote.tgz --prerelease --target "$GITHUB_SHA" --title "pacote-temp" --notes "Temporario."
