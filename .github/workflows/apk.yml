name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    # Fixo no 24.04: o ubuntu-latest muda de versão sozinho.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Número da versão
        run: |
          CODIGO=$(git rev-list --count HEAD)
          BASE=$(grep '^bolao.versao=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION_CODE=$CODIGO" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$BASE.$CODIGO" >> "$GITHUB_ENV"
          echo "Versão $BASE.$CODIGO"

      - name: Chave de assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            # Sem a senha o build roda assim mesmo (para conferir o código), mas não publica.
            echo "::warning::Falta o segredo KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in keystore/bolao.p12.enc -out "$RUNNER_TEMP/bolao.p12" -pass env:KEYSTORE_PASSWORD
          echo "KEYSTORE_FILE=$RUNNER_TEMP/bolao.p12" >> "$GITHUB_ENV"

      - name: Testes e APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      # Resumo dos erros como anotações (aparecem na página do build, sem precisar do log).
      - name: Resumo dos erros
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          avisos = []
          try:
              linhas = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              linhas = []
          erros = [l for l in linhas if l.startswith("e: ") or "error:" in l]
          for i in range(0, min(len(erros), 40), 8):
              avisos.append("Compilação:%0A" + "%0A".join(erros[i:i + 8]))
          for arq in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for caso in ET.parse(arq).getroot().iter("testcase"):
                  for f in list(caso.findall("failure")) + list(caso.findall("error")):
                      msg = (f.get("message") or "").replace("\n", " ")[:400]
                      avisos.append(f"Teste {caso.get('classname')}.{caso.get('name')}: {msg}")
          if not avisos:
              falhou = [l for l in linhas if "What went wrong" in l or "FAILED" in l]
              avisos.append("%0A".join(falhou[:10]) or "Falhou (veja o log).")
          for a in avisos[:10]:
              print("::error::" + a.replace("\r", ""))
          PY

      # Só a branch main publica versão; as outras branches só conferem se compila e passa nos testes.
      - name: Publicar no Releases
        if: env.KEYSTORE_FILE != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="bolao-admin-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Notas = mensagem do commit, sem as linhas de coautoria.
          git log -1 --pretty=%B | sed '/^Co-Authored-By:/Id; /^Claude-Session:/d' > notas.txt
          gh release create "v$VERSION_NAME" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Versão $VERSION_NAME" \
            --notes-file notas.txt \
            --latest
          echo "### Versão $VERSION_NAME publicada" >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar que não publicou
        if: env.KEYSTORE_FILE == ''
        run: |
          echo "::error::O código compilou, mas a versão não foi publicada: falta o segredo KEYSTORE_PASSWORD."
          exit 1

      - name: Relatório dos testes (se falharem)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          retention-days: 7
